name: Refresh Whales — Har 4 Ghante

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-whales:
    runs-on: ubuntu-latest
    env:
      RPC_URL:        ${{ secrets.RPC_URL }}
      GRAPH_API_KEY:  ${{ secrets.GRAPH_API_KEY }}
      PRIVATE_KEY:    ${{ secrets.PRIVATE_KEY }}
      WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install ethers@5.7.2 axios

      - name: Refresh Whale List (10K scan)
        run: node findWhales.js
        timeout-minutes: 25

      - name: Commit updated whales.json
        run: |
          git config user.email "bot@liquidation.com"
          git config user.name "Liquidation Bot"
          git add whales.json
          git diff --staged --quiet || git commit -m "🐋 Auto: Whale list refreshed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
